<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14120F">
<title>M5 · Спринт</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14120F; --gold:#B0894F; --gold-d:#8C6A34; --gold-s:#D9B87C;
  --bone:#F4EEE4; --paper:#FBFAF8; --stone:#B8AD9E; --soft:#6E6656; --line:#E8DFCE;
  --ok:#3F8F5B; --sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; --mono:'Space Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.45;
     font-size:16px;padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}

/* ---------- ГЕЙТ ---------- */
#gate{position:fixed;inset:0;background:var(--ink);z-index:50;display:flex;
      align-items:center;justify-content:center;padding:24px}
#gate.hide{display:none}
.gate-box{width:100%;max-width:300px;text-align:center}
.gate-logo{font-size:34px;font-weight:800;color:var(--bone);letter-spacing:-1px;line-height:1}
.gate-logo b{color:var(--gold-s)}
.gate-logo small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:5px;
                 color:var(--stone);font-weight:400;margin-top:10px}
.gate-t{color:var(--stone);font-size:14px;margin:26px 0 16px}
#pw{width:100%;height:52px;border-radius:12px;border:1px solid #35302A;background:#1E1B16;
    color:var(--bone);text-align:center;font-size:20px;font-family:var(--mono);letter-spacing:6px;
    outline:none;transition:border-color .15s}
#pw:focus{border-color:var(--gold)}
#gate.err #pw{border-color:#C0483C;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gate-btn{width:100%;height:50px;margin-top:12px;border:0;border-radius:12px;background:var(--gold);
          color:var(--ink);font-family:var(--sans);font-size:16px;font-weight:600;cursor:pointer}
.gate-btn:active{opacity:.85}

/* ---------- ШАПКА ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(251,250,248,.92);
       backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
       border-bottom:1px solid var(--line)}
.hd{max-width:720px;margin:0 auto;padding:14px 18px 0}
.hd-top{display:flex;align-items:center;gap:14px}
.ring{width:46px;height:46px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring-n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        font-family:var(--mono);font-size:12px;font-weight:700}
.hd-txt{flex:1;min-width:0}
.hd-txt h1{font-size:17px;font-weight:700;letter-spacing:-.2px}
.hd-txt p{font-size:13px;color:var(--soft);margin-top:1px}
.me{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bone);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
    cursor:pointer;border:0;font-family:var(--sans)}
/* сегменты */
.segs{display:flex;gap:2px;background:var(--bone);border-radius:10px;padding:3px;margin:12px 0 12px}
.seg{flex:1 1 0;min-width:0;border:0;background:transparent;font-family:var(--sans);font-size:13px;
     font-weight:600;color:var(--soft);padding:7px 2px;border-radius:8px;cursor:pointer;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,18,15,.10)}

/* ---------- СПИСОК ---------- */
main{max-width:720px;margin:0 auto;padding:6px 18px 70px}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;gap:8px;padding:0 2px 8px;flex-wrap:wrap}
.sec-h h2{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--gold-d)}
.sec-h span{font-size:12px;color:var(--stone)}
.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px;padding:13px 14px;cursor:pointer;
     border-bottom:1px solid var(--line);position:relative;transition:background .12s}
.row:last-child{border-bottom:0}
.row:active{background:var(--paper)}
.cb{width:23px;height:23px;flex:none;border-radius:50%;border:1.8px solid #CFC4B0;background:#fff;
    margin-top:1px;position:relative;transition:all .18s;cursor:pointer}
.cb::after{content:'';position:absolute;left:7.5px;top:3.5px;width:5px;height:10px;
           border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .18s}
.done .cb{background:var(--ok);border-color:var(--ok)}
.done .cb::after{transform:rotate(45deg) scale(1)}
.rc{flex:1;min-width:0}
.rt{font-size:15.5px;font-weight:500;letter-spacing:-.1px;transition:color .18s}
.done .rt{color:var(--stone);text-decoration:line-through}
.rm{display:flex;align-items:center;gap:7px;margin-top:4px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:11px;color:var(--soft)}
.tag.due{color:var(--gold-d);font-weight:700}
.dot{width:3px;height:3px;border-radius:50%;background:var(--stone);flex:none}
.av{display:flex;gap:-4px}
.av i{width:19px;height:19px;border-radius:50%;background:var(--bone);color:var(--gold-d);
      font-style:normal;font-size:10px;font-weight:700;display:flex;align-items:center;
      justify-content:center;border:1.5px solid #fff;margin-left:-5px;font-family:var(--sans)}
.av i:first-child{margin-left:0}
.chev{flex:none;width:16px;color:#CFC4B0;font-size:13px;margin-top:3px;transition:transform .2s}
.open .chev{transform:rotate(90deg)}
.crit-bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
/* деталь */
.det{display:none;flex:0 0 100%;width:100%;padding:2px 0 2px 35px;font-size:14px;
     color:var(--soft);line-height:1.55}
.open .det{display:block}
.det p{margin-bottom:9px}
.det ul{list-style:none;margin:0 0 9px}
.det li{position:relative;padding-left:16px;margin-bottom:5px}
.det li::before{content:'';position:absolute;left:3px;top:8px;width:4px;height:4px;
                border-radius:50%;background:var(--gold)}
.det .warn{background:#FBF3E6;border-radius:9px;padding:9px 11px;color:var(--ink);font-size:13.5px}
.det .warn b{color:var(--gold-d)}
.by{font-family:var(--mono);font-size:11px;color:var(--stone);margin-top:8px}

/* якоря + низ */
.anchors{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.anc{background:var(--ink);border-radius:12px;padding:11px 9px;text-align:center}
.anc b{display:block;font-family:var(--mono);font-size:14px;color:var(--gold-s);font-weight:700}
.anc span{display:block;font-size:10.5px;color:var(--stone);margin-top:3px;line-height:1.3}
.foot{text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--stone);margin-top:24px;line-height:1.7}
#sync{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bone);
      font-size:12.5px;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .25s;
      pointer-events:none;z-index:30;font-family:var(--sans)}
#sync.on{opacity:1}
/* выбор «кто я» */
#who{position:fixed;inset:0;background:rgba(20,18,15,.55);z-index:40;display:none;
     align-items:flex-end;justify-content:center}
#who.on{display:flex}
.who-b{background:#fff;width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
.who-b h3{font-size:16px;font-weight:700;margin-bottom:4px}
.who-b p{font-size:13.5px;color:var(--soft);margin-bottom:14px}
.who-o{display:flex;align-items:center;gap:12px;padding:13px 12px;border:1px solid var(--line);
       border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:15px;font-weight:500}
.who-o:active{background:var(--paper)}
.who-o i{width:30px;height:30px;border-radius:50%;background:var(--bone);color:var(--gold-d);
         font-style:normal;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
@media(min-width:600px){ .det{font-size:14.5px} .rt{font-size:16px} }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <div class="gate-logo">M<b>5</b><small>SPRINT</small></div>
    <p class="gate-t">Внутренний чеклист команды</p>
    <form id="gf" autocomplete="off">
      <input id="pw" type="password" inputmode="numeric" placeholder="••••" autocomplete="off">
      <button class="gate-btn" type="submit">Открыть</button>
    </form>
  </div>
</div>

<header hidden id="hdr">
  <div class="hd">
    <div class="hd-top">
      <div class="ring">
        <svg width="46" height="46" viewBox="0 0 46 46">
          <circle cx="23" cy="23" r="19" fill="none" stroke="#EDE4D3" stroke-width="4"/>
          <circle id="arc" cx="23" cy="23" r="19" fill="none" stroke="#B0894F" stroke-width="4"
                  stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4"
                  style="transition:stroke-dashoffset .5s"/>
        </svg>
        <div class="ring-n" id="ringN">0/0</div>
      </div>
      <div class="hd-txt">
        <h1>Спринт Майами</h1>
        <p id="hdSub">Сентябрь — октябрь 2026</p>
      </div>
      <button class="me" id="meBtn" title="Кто я">?</button>
    </div>
    <div class="segs" id="segs">
      <button class="seg on" data-f="all">Всё</button>
      <button class="seg" data-f="mine">Моё</button>
      <button class="seg" data-f="crit">Горит</button>
      <button class="seg" data-f="open">Открытые</button>
    </div>
  </div>
</header>

<main id="app"></main>

<div id="sync"></div>

<div id="who">
  <div class="who-b">
    <h3>Кто ты?</h3>
    <p>Чтобы отмечать задачи от своего имени и включать фильтр «Моё».</p>
    <div class="who-o" data-w="alex"><i>А</i>Алекс</div>
    <div class="who-o" data-w="vlad"><i>В</i>Влад</div>
    <div class="who-o" data-w="vadim"><i>В</i>Вадим</div>
  </div>
</div>

      .then(function(pt){
        DATA=JSON.parse(new TextDecoder().decode(pt));
        try{ localStorage.setItem('m5_sprint_pw', pass) }catch(e){}
        gate.classList.add('hide');
        document.getElementById('hdr').hidden=false;
        ME=null; try{ ME=localStorage.getItem('m5_sprint_me') }catch(e){}
        if(ME){ document.getElementById('meBtn').textContent=INIT[ME] } else { setTimeout(askWho,300) }
        render(); pull();
      });
  }
  gf.addEventListener('submit',function(e){
    e.preventDefault();
    unlock(pw.value.trim()).catch(function(){
      gate.classList.remove('err'); void gate.offsetWidth; gate.classList.add('err'); pw.select();
    });
  });
  try{ var saved=localStorage.getItem('m5_sprint_pw'); if(saved){ unlock(saved).catch(function(){}) } }catch(e){}

  /* ---------- кто я ---------- */
  var who=document.getElementById('who');
  function askWho(){ who.classList.add('on') }
  document.getElementById('meBtn').addEventListener('click',askWho);
  who.addEventListener('click',function(e){
    var o=e.target.closest('.who-o');
    if(!o){ if(e.target===who) who.classList.remove('on'); return }
    ME=o.getAttribute('data-w');
    try{ localStorage.setItem('m5_sprint_me',ME) }catch(_){}
    document.getElementById('meBtn').textContent=INIT[ME];
    who.classList.remove('on'); render();
  });

  /* ---------- синхронизация с M5 Hub ---------- */
  function toast(t){ var s=document.getElementById('sync'); s.textContent=t; s.classList.add('on');
    clearTimeout(s._t); s._t=setTimeout(function(){s.classList.remove('on')},1800) }

  function pull(){
    var cbn='sp'+Date.now();
    window[cbn]=function(r){ if(r&&r.ok&&r.state){ STATE=r.state; render() } try{delete window[cbn]}catch(e){} };
    var s=document.createElement('script');
    s.src=HOOK+'?sprint=1&cb='+cbn+'&z='+Date.now();
    s.onerror=function(){ try{delete window[cbn]}catch(e){} };
    document.body.appendChild(s);
    setTimeout(function(){ s.remove() }, 12000);
  }

  function push(id,done){
    var body=JSON.stringify({type:'sprint',op:'set',id:id,done:done?1:0,who:ME||'',ts:Date.now()});
    if(navigator.sendBeacon){
      navigator.sendBeacon(HOOK, new Blob([body],{type:'text/plain;charset=utf-8'}));
    }else{
      fetch(HOOK,{method:'POST',mode:'no-cors',body:body});
    }
  }

  /* ---------- рендер ---------- */
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;') }

  function match(it){
    if(FILTER==='mine') return ME && (it.who||'').split(',').indexOf(ME)>-1;
    if(FILTER==='crit') return !!it.crit;
    if(FILTER==='open') return !(STATE[it.id]&&STATE[it.id].done);
    return true;
  }

  function render(){
    if(!DATA) return;
    var all=0, done=0, html='';
    DATA.sections.forEach(function(sec){
      var rows='';
      sec.items.forEach(function(it){
        all++; var st=STATE[it.id]||{}; if(st.done) done++;
        if(!match(it)) return;
        var isOpen=!!OPENED[it.id];
        var avs=(it.who||'').split(',').filter(Boolean).map(function(w){
          return '<i title="'+esc(NAMES[w]||w)+'">'+esc(INIT[w]||'?')+'</i>' }).join('');
        var det='';
        if(it.why) det+='<p>'+esc(it.why)+'</p>';
        if(it.steps&&it.steps.length){
          det+='<ul>'+it.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ul>';
        }
        if(it.block) det+='<div class="warn"><b>Что мешает:</b> '+esc(it.block)+'</div>';
        if(st.done&&st.who) det+='<div class="by">Отметил: '+esc(NAMES[st.who]||st.who)+(st.at?' · '+esc(st.at):'')+'</div>';
        rows+='<div class="row'+(st.done?' done':'')+(isOpen?' open':'')+'" data-id="'+esc(it.id)+'">'
          + (it.crit?'<div class="crit-bar"></div>':'')
          + '<div class="cb" data-cb="1"></div>'
          + '<div class="rc"><div class="rt">'+esc(it.t)+'</div>'
          + '<div class="rm"><span class="tag due">'+esc(it.due||'')+'</span>'
          + (avs?'<span class="dot"></span><span class="av">'+avs+'</span>':'')
          + '</div></div><div class="chev">›</div>'
          + '<div class="det">'+det+'</div></div>';
      });
      if(rows) html+='<section class="sec"><div class="sec-h"><h2>'+esc(sec.name)+'</h2><span>'+esc(sec.hint||'')+'</span></div><div class="list">'+rows+'</div></section>';
    });
    if(!html) html='<section class="sec"><div class="list"><div class="row"><div class="rc"><div class="rt">Тут пусто</div><div class="rm"><span class="tag">Смени фильтр наверху</span></div></div></div></div></section>';

    var anc='<div class="anchors">'+DATA.anchors.map(function(a){
      return '<div class="anc"><b>'+esc(a.d)+'</b><span>'+esc(a.t)+'</span></div>' }).join('')+'</div>';
    document.getElementById('app').innerHTML=html+anc+
      '<div class="foot">M5 STUDIO MIAMI LLC · внутренний документ<br>Отмечай сразу — остальные видят<br><span style="opacity:.7">Открытие шоу-рума: 5 ноября 2026</span></div>';

    document.getElementById('ringN').textContent=done+'/'+all;
    var pct=all?done/all:0;
    document.getElementById('arc').style.strokeDashoffset=String(119.4*(1-pct));
    document.getElementById('hdSub').textContent = done===all&&all
      ? 'Всё закрыто. Красиво.'
      : 'Осталось '+(all-done)+' из '+all+' · до 5 ноября';
  }

  /* клики: чекбокс отмечает, строка раскрывает */
  document.getElementById('app').addEventListener('click',function(e){
    var row=e.target.closest('.row'); if(!row) return;
    var id=row.getAttribute('data-id'); if(!id) return;
    if(e.target.closest('[data-cb]')){
      var cur=!!(STATE[id]&&STATE[id].done);
      if(!cur&&!ME){ askWho(); return }
      var d=!cur;
      STATE[id]={done:d,who:ME,at:new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})};
      render(); push(id,d);
      toast(d?'Отмечено · видят все':'Снята отметка');
      return;
    }
    OPENED[id]=!OPENED[id]; render();
  });

  document.getElementById('segs').addEventListener('click',function(e){
    var b=e.target.closest('.seg'); if(!b) return;
    FILTER=b.getAttribute('data-f');
    [].forEach.call(this.querySelectorAll('.seg'),function(x){x.classList.toggle('on',x===b)});
    if(FILTER==='mine'&&!ME){ askWho(); }
    render();
  });

  /* тянем состояние при возврате на вкладку */
  document.addEventListener('visibilitychange',function(){ if(!document.hidden&&DATA) pull() });
})();
</script>
</body>
</html>
