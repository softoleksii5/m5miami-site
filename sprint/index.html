<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">

<title>M5 · Спринт</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --ink:#14120F; --gold:#B0894F; --gold-d:#8C6A34; --gold-s:#D9B87C;
  --bone:#F4EEE4; --paper:#FBFAF8; --stone:#B8AD9E; --soft:#6E6656; --line:#E8DFCE;
  --ok:#3F8F5B; --sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; --mono:'Space Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.45;font-size:16px;overflow-x:hidden}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* гейт */
#gate{position:fixed;inset:0;background:var(--ink);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
#gate.hide{display:none}
.gate-box{width:100%;max-width:300px;text-align:center}
.gate-logo{font-size:34px;font-weight:800;color:var(--bone);letter-spacing:-1px;line-height:1}
.gate-logo b{color:var(--gold-s)}
.gate-logo small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:5px;color:var(--stone);font-weight:400;margin-top:10px}
.gate-t{color:var(--stone);font-size:14px;margin:26px 0 16px}
#pw{width:100%;height:52px;border-radius:12px;border:1px solid #35302A;background:#1E1B16;color:var(--bone);
    text-align:center;font-size:20px;font-family:var(--mono);letter-spacing:6px;outline:none}
#pw:focus{border-color:var(--gold)}
#gate.err #pw{border-color:#C0483C;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gate-btn{width:100%;height:50px;margin-top:12px;border:0;border-radius:12px;background:var(--gold);color:var(--ink);
          font-family:var(--sans);font-size:16px;font-weight:600;cursor:pointer}

/* шапка */
header{position:sticky;top:0;z-index:20;background:rgba(251,250,248,.94);backdrop-filter:blur(14px);
       -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{max-width:860px;margin:0 auto;padding:12px 16px 0}
.hd-top{display:flex;align-items:center;gap:12px}
.ring{width:42px;height:42px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring-n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700}
.hd-txt{flex:1;min-width:0}
.hd-txt h1{font-size:16px;font-weight:700;letter-spacing:-.2px}
.hd-txt p{font-size:12.5px;color:var(--soft);margin-top:1px}
.team{display:flex;gap:5px;flex:none}
.tm{display:flex;align-items:center;gap:5px;padding:5px 9px;border:1px solid var(--line);background:#fff;
    border-radius:20px;cursor:pointer;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--soft)}
.tm i{width:17px;height:17px;border-radius:50%;background:var(--bone);color:var(--gold-d);font-style:normal;
      font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.tm.on{background:var(--ink);border-color:var(--ink);color:var(--bone)}
.tm.on i{background:var(--gold);color:var(--ink)}
.tm span{display:none}
@media(min-width:560px){ .tm span{display:inline} }

/* вкладки */
.tabs{display:flex;gap:4px;margin-top:11px;overflow-x:auto;scrollbar-width:none;padding-bottom:9px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;padding:8px 12px;border:0;background:var(--bone);border-radius:10px;
     cursor:pointer;font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--soft);white-space:nowrap}
.tab.on{background:var(--ink);color:var(--bone)}
.tab .cnt{font-family:var(--mono);font-size:10.5px;opacity:.75}

main{max-width:860px;margin:0 auto;padding:14px 16px 30px}

/* обзор: карточки целей */
.goals{display:grid;grid-template-columns:1fr;gap:9px}
@media(min-width:620px){ .goals{grid-template-columns:1fr 1fr} }
.gcard{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);
       border-radius:14px;padding:14px;cursor:pointer;text-align:left;font-family:var(--sans);width:100%}
.gcard:active{background:var(--paper)}
.gi{width:38px;height:38px;border-radius:11px;background:var(--bone);color:var(--gold-d);display:flex;
    align-items:center;justify-content:center;flex:none}
.gi svg.ic{width:20px;height:20px;stroke-width:1.6}
.gc-b{flex:1;min-width:0}
.gc-b h3{font-size:15px;font-weight:700;letter-spacing:-.1px}
.gc-b p{font-size:12.5px;color:var(--soft);margin-top:2px;line-height:1.35}
.bar{display:block;height:5px;background:var(--bone);border-radius:3px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .4s}
.gc-n{font-family:var(--mono);font-size:11px;color:var(--soft);margin-top:5px;display:flex;justify-content:space-between}
.gc-n b{color:var(--gold-d)}
.done-all .gi{background:#E6F2EA;color:var(--ok)}
.done-all .bar i{background:var(--ok)}

/* список раздела */
.goal-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.goal-head .gi{width:42px;height:42px;border-radius:12px}
.goal-head h2{font-size:17px;font-weight:700;letter-spacing:-.2px;line-height:1.25}
.goal-head p{font-size:12.5px;color:var(--soft);margin-top:2px}
.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:11px;padding:12px 13px;cursor:pointer;
     border-bottom:1px solid var(--line);position:relative}
.row:last-child{border-bottom:0}
.row:active{background:var(--paper)}
.cb{width:22px;height:22px;flex:none;border-radius:50%;border:1.8px solid #CFC4B0;background:#fff;margin-top:1px;
    position:relative;transition:all .18s;cursor:pointer}
.cb::after{content:'';position:absolute;left:7px;top:3.5px;width:5px;height:9.5px;border:solid #fff;
           border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .18s}
.done .cb{background:var(--ok);border-color:var(--ok)}
.done .cb::after{transform:rotate(45deg) scale(1)}
.ri{color:var(--gold-d);margin-top:2px;flex:none;display:flex}
.done .ri{color:var(--stone)}
.rc{flex:1;min-width:0}
.rt{font-size:15px;font-weight:500;letter-spacing:-.1px}
.done .rt{color:var(--stone);text-decoration:line-through}
.rm{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.av{display:flex}
.av i{width:18px;height:18px;border-radius:50%;background:var(--bone);color:var(--gold-d);font-style:normal;
      font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;margin-left:-4px}
.av i:first-child{margin-left:0}
.tag{font-family:var(--mono);font-size:10.5px;color:var(--gold-d);font-weight:700;letter-spacing:.5px}
.chev{flex:none;width:14px;color:#CFC4B0;font-size:13px;margin-top:3px;transition:transform .2s}
.open .chev{transform:rotate(90deg)}
.crit-bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.det{display:none;flex:0 0 100%;width:100%;padding:2px 0 2px 33px;font-size:13.5px;color:var(--soft);line-height:1.55}
.open .det{display:block}
.det p{margin-bottom:8px}
.det ul{list-style:none;margin:0 0 8px}
.det li{position:relative;padding-left:15px;margin-bottom:4px}
.det li::before{content:'';position:absolute;left:3px;top:8px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.det .warn{background:#FBF3E6;border-radius:9px;padding:8px 10px;color:var(--ink);font-size:13px}
.det .warn b{color:var(--gold-d)}
.by{font-family:var(--mono);font-size:10.5px;color:var(--stone);margin-top:7px}
.foot{text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--stone);margin-top:18px;line-height:1.7}
#sync{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:var(--bone);
      font-size:12.5px;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
#sync.on{opacity:1}
</style>
</head>

        +'<span class="bar"><i style="width:'+pct+'%"></i></span>'
        +'<span class="gc-n"><span>'+st.done+' из '+st.all+'</span>'
        +(hot?'<b>сначала: '+hot+'</b>':(st.done===st.all?'<b>закрыто</b>':'<span>—</span>'))+'</span></span></button>';
    });
    return h+'</div>';
  }

  function sectionHtml(sec){
    var rows='';
    sec.items.forEach(function(it){
      var st=STATE[it.id]||{}, isOpen=!!OPENED[it.id];
      var avs=(it.who||'').split(',').filter(Boolean).map(function(w){
        return '<i title="'+esc(NAMES[w]||w)+'">'+esc(INIT[w]||'?')+'</i>' }).join('');
      var det='';
      if(it.why) det+='<p>'+esc(it.why)+'</p>';
      if(it.steps&&it.steps.length) det+='<ul>'+it.steps.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
      if(it.block) det+='<div class="warn"><b>Что мешает:</b> '+esc(it.block)+'</div>';
      if(st.done&&st.who) det+='<div class="by">Отметил: '+esc(NAMES[st.who]||st.who)+(st.at?' · '+esc(st.at):'')+'</div>';
      rows+='<div class="row'+(st.done?' done':'')+(isOpen?' open':'')+'" data-id="'+esc(it.id)+'">'
        +(it.crit?'<div class="crit-bar"></div>':'')
        +'<div class="cb" data-cb="1"></div>'
        +'<span class="ri">'+ic(it.icon||'star')+'</span>'
        +'<div class="rc"><div class="rt">'+esc(it.t)+'</div><div class="rm">'
        +(avs?'<span class="av">'+avs+'</span>':'')
        +(it.crit?'<span class="tag">СНАЧАЛА</span>':'')
        +'</div></div><div class="chev">›</div><div class="det">'+det+'</div></div>';
    });
    return '<div class="goal-head"><span class="gi">'+ic(sec.icon)+'</span><div><h2>'+esc(sec.goal||sec.name)
      +'</h2><p>'+esc(sec.hint||'')+'</p></div></div><div class="list">'+rows+'</div>';
  }

  function render(){
    if(!DATA) return;
    tabsHtml();
    var all=0,done=0;
    DATA.sections.forEach(function(s){ var st=stats(s); all+=st.all; done+=st.done });
    var sec=null; DATA.sections.forEach(function(s){ if(s.id===VIEW) sec=s });
    document.getElementById('app').innerHTML=(sec?sectionHtml(sec):overviewHtml())
      +'<div class="foot">M5 STUDIO MIAMI LLC · внутренний документ<br>Отмечай сразу — остальные видят</div>';
    document.getElementById('ringN').textContent=done+'/'+all;
    document.getElementById('arc').style.strokeDashoffset=String(110*(1-(all?done/all:0)));
    document.getElementById('hdT').textContent = sec ? sec.name : 'Спринт Майами';
    document.getElementById('hdSub').textContent = sec ? (done+' из '+all+' по всем целям')
      : (done===all&&all ? 'Всё закрыто' : 'Пять больших целей');
  }

  document.getElementById('app').addEventListener('click',function(e){
    var card=e.target.closest('.gcard');
    if(card){ VIEW=card.getAttribute('data-v'); window.scrollTo(0,0); render(); return }
    var row=e.target.closest('.row'); if(!row) return;
    var id=row.getAttribute('data-id'); if(!id) return;
    if(e.target.closest('[data-cb]')){
      var cur=!!(STATE[id]&&STATE[id].done), d=!cur;
      STATE[id]=d?{done:true,who:ME||'',at:new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})}:{};
      render(); push(id,d); toast(d?'Отмечено · видят все':'Снята отметка');
      return;
    }
    OPENED[id]=!OPENED[id]; render();
  });

  document.getElementById('tabs').addEventListener('click',function(e){
    var b=e.target.closest('.tab'); if(!b) return;
    VIEW=b.getAttribute('data-v'); window.scrollTo(0,0); render();
  });

  document.addEventListener('visibilitychange',function(){ if(!document.hidden&&DATA) pull() });
})();
</script>
</body>
</html>
